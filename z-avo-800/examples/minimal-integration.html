<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Minimal Integration — Z-AVO 800</title>
  <style>
    body { background: #101418; color: #d7dee6; font-family: Arial, sans-serif; max-width: 860px; margin: 30px auto; padding: 0 18px; }
    h1 { font-size: 20px; } code, pre { font-family: ui-monospace, monospace; }
    pre { background: #0d1014; border: 1px solid #262c34; border-radius: 10px; padding: 14px; font-size: 12px; line-height: 1.6; overflow-x: auto; color: #9fb6cc; }
    button { padding: 9px 16px; border-radius: 8px; border: 1px solid #0f5a26; background: linear-gradient(180deg,#58e878,#23b84a); color: #052d12; font-weight: 700; cursor: pointer; margin-right: 10px; }
    button.ghost { background: #1a2027; color: #ffe17a; border: 1px solid #2b323b; font-weight: 400; }
    #status { margin-left: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Contoh integrasi minimal — kirim V = 4.5 V DC ke AVOmeter</h1>
  <p>Halaman ini adalah contoh kode paling kecil untuk mengendalikan AVOmeter
     (buka <code>../index.html</code>). Bekerja via <code>BroadcastChannel</code> (http://localhost)
     atau <code>window.postMessage</code> (fallback bila dibuka via file://).</p>

  <p>
    <button id="open">Buka AVOmeter ↗</button>
    <button id="send" class="ghost">Kirim V = 4.5 V (DCV)</button>
    <span id="status">status: -</span>
  </p>

  <pre id="code"></pre>

  <script>
    /* ---------- 1) pilih transport ---------- */
    var bc = null, avoWin = null;
    if (location.protocol !== 'file:') {
      bc = new BroadcastChannel('avo-bridge');        // dua window terpisah (http)
    }
    function send(cmd, args) {
      var msg = { __avo: true, cmd: cmd, args: args };
      if (bc) bc.postMessage(msg);
      else if (avoWin && !avoWin.closed) avoWin.postMessage(msg, '*');
    }

    /* ---------- 2) deteksi AVOmeter lewat event heartbeat ---------- */
    function listen(cb) {
      if (bc) bc.onmessage = function (ev) { cb(ev.data); };
      else window.addEventListener('message', function (ev) { cb(ev.data); });
    }
    listen(function (d) {
      if (d && d.__avo && d.__avoEvent && d.event === 'heartbeat') {
        document.getElementById('status').textContent = 'status: terhubung ✓';
        document.getElementById('status').style.color = '#45e873';
      }
    });

    /* ---------- 3) buka window AVOmeter ---------- */
    document.getElementById('open').onclick = function () {
      avoWin = window.open('../index.html', 'z-avo', 'width=720,height=900');
    };

    /* ---------- 4) kirim pengukuran + konfigurasi ---------- */
    document.getElementById('send').onclick = function () {
      // Set mode to DC voltage, attach probes to virtual nodes, send samples.
      send('setMode', ['DCV']);
      send('attachProbe', ['red', 'nA']);
      send('attachProbe', ['black', 'nB']);

      // Stream a constant 4.5 V (DC) measurement ~10 Hz.
      var v = 4.5;
      var N = 32;
      setInterval(function () {
        var buf = new Float32Array(N);              // selalu Float32Array
        for (var i = 0; i < N; i++) buf[i] = v;     // constant DC sample
        send('setMeasurement', [{
          type: 'voltage',
          samples: buf,
          sampleRate: 1000,
          scalar: v,                                // shortcut: AVOmeter shows this directly
          probes: { red: 'nA', black: 'nB' }
        }]);
      }, 100);
    };

    document.getElementById('code').textContent = document.querySelector('script').textContent.trim();
  </script>
</body>
</html>
